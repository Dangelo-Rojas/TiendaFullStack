<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casas Embrujadas | Iniciar sesión</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="encabezado" id="header"></header>

  <main class="contenedor">
    <h1 class="titulo-seccion">Iniciar sesión</h1>

    <form class="formulario" id="form-login" action="#" method="post" novalidate>

      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" maxlength="100" placeholder="ejemplo@correo.com">
        <span class="error" id="error-correo"></span>
      </div>

      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" minlength="4" maxlength="10" placeholder="Entre 4 y 10 caracteres">
        <span class="error" id="error-contrasena"></span>
      </div>

      <button type="submit" class="boton" style="width:100%;">Iniciar sesión</button>

      <p style="margin-top:15px; font-size:0.9rem; text-align:center;">
        ¿No tienes cuenta? <a href="registro.html" style="color:#ff7a1a;">Regístrate</a>
      </p>
    </form>
  </main>

  <footer class="pie-pagina" id="footer"></footer>

  <script src="scripts/estructura.js"></script>
  <script src="scripts/validaciones.js"></script>
  <script src="scripts/login.js"></script>
</body>
</html>

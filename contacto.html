<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casas Embrujadas | Contacto</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="encabezado">
    <div class="contenedor barra-navegacion">
      <a href="index.html" class="logo">Casas Embrujadas</a>
      <nav>
        <ul class="menu-principal">
          <li><a href="index.html">Home</a></li>
          <li><a href="productos.html">Propiedades</a></li>
          <li><a href="nosotros.html">Nosotros</a></li>
          <li><a href="blogs.html">Blogs</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
      <div class="acciones-usuario">
        <a href="login.html">Iniciar sesión</a>
        <a href="registro.html">Registrarse</a>
        <a href="carrito.html" class="carrito">🛒 Carrito (0)</a>
      </div>
    </div>
  </header>

  <main class="contenedor">
    <h1 class="titulo-seccion">Contáctanos</h1>

  
    <form class="formulario" id="form-contacto" action="#" method="post" novalidate>


      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" maxlength="100" placeholder="Ej: Juan Pérez">
        <span class="error" id="error-nombre"></span>
      </div>

      <div class="campo">
        <label for="correo">Correo electrónico</label>

        <input type="email" id="correo" name="correo" maxlength="100" placeholder="ejemplo@correo.com">
        <span class="error" id="error-correo"></span>
      </div>

      <div class="campo">
        <label for="mensaje">Mensaje</label>

        <textarea id="mensaje" name="mensaje" rows="5" maxlength="500" placeholder="Cuéntanos en qué te podemos ayudar..."></textarea>
        <span class="error" id="error-mensaje"></span>
      </div>

      <button type="submit" class="boton" style="width:100%;">Enviar mensaje</button>
    </form>
  </main>

  <footer class="pie-pagina">
    <div class="contenedor">
      <p>Casas Embrujadas — Propiedades con historia desde 1899</p>
      <p>&copy; 2026 Casas Embrujadas. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="scripts/validaciones.js"></script>
  <script src="scripts/contacto.js"></script>
</body>
</html>
